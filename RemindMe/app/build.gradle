import java.text.SimpleDateFormat

apply plugin: 'com.android.application'
//apply plugin: 'io.fabric'

def static buildTime() {
    def df = new SimpleDateFormat("yyyyMMddHHmm") // you can change it
    df.setTimeZone(TimeZone.getTimeZone("UTC"))
    return df.format(new Date())
}

android {
    signingConfigs {
        config {
            keyAlias 'key0'
            keyPassword '12581258'
            storeFile file('C:/W/_Android_/KEY/sign.jks')
            storePassword '12581258'
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    compileSdk(37)
    defaultConfig {
        applicationId 'com.moris.tavda'
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 22
        ndk {
            debugSymbolLevel 'FULL'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
//        versionName "2.0"


        vectorDrawables.useSupportLibrary =
                true
    }
    buildTypes {
        release {
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled true
            zipAlignEnabled true
            signingConfig signingConfigs.config
        }
        debug {
            minifyEnabled false
        }
    }
    flavorDimensions "tier"
    productFlavors {
        free {
            applicationIdSuffix ".free"
            versionName "1.0-free-build-${buildTime()}"
            dimension "tier"
            signingConfig signingConfigs.config
        }
        pro {
            applicationIdSuffix ".pro"
            versionName "1.0-pro-build-${buildTime()}"
            dimension "tier"
            signingConfig signingConfigs.config
        }
    }

    applicationVariants.all { variant ->
            variant.outputs.all { output ->
                def project = "Tavda"
                def SEP = "_"
            def flavor = flavorName
            //variant.variantData.variantConfiguration.flavorName
                def buildType = variant.buildType.name
//            def version = variant.versionName
                def date = new Date()
                def formattedDate = date.format('ddMMyyyyHHmm')

                def newApkName = project + SEP + flavor + SEP + buildType + SEP + "1.0" + SEP + formattedDate + ".apk"

            outputFileName = new File(newApkName)
            }
    }

    packagingOptions {
        exclude 'AndroidManifest.xml'
        exclude 'resources.arsc'
        resources.excludes.add("res/drawable/*")
        resources.excludes.add("res/layout/*")
    }

    packagingOptions {
//        exclude 'META-INF/notice.txt'
//        exclude 'META-INF/license.txt'
//        exclude 'META-INF/NOTICE'
//        exclude 'META-INF/LICENSE'
    }
    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
 //   buildToolsVersion '31.0.0'
    namespace 'com.moris.tavda'
}

